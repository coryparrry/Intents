name: DuplicateTasks
options:
  bundleIdPrefix: com.coryparry.IntentsAutomation
  deploymentTarget:
    iOS: '26.0'
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '1.0'
    CODE_SIGNING_ALLOWED: NO
targets:
  DuplicateTasks:
    type: application
    platform: iOS
    sources: [App, Models]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coryparry.IntentsAutomation.DuplicateTasks
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  DuplicateTasksMac:
    type: application
    platform: macOS
    sources: [App, Models]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coryparry.IntentsAutomation.DuplicateTasks
        ENABLE_APP_SANDBOX: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
schemes:
  DuplicateTasks:
    build:
      targets:
        DuplicateTasks: all
  DuplicateTasksMac:
    build:
      targets:
        DuplicateTasksMac: all
