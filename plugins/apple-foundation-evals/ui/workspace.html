<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundation Evals</title><style>/* STYLES */</style></head>
<body><div class="app-shell"><aside id="workspace-sidebar" aria-label="Evaluation workspace">
<div class="sidebar-heading"><span id="workspace-symbol" aria-hidden="true"></span><strong>Foundation Evals</strong></div>
<label class="search-field"><span id="search-symbol" aria-hidden="true"></span><input id="workspace-search" type="search" placeholder="Filter runs" aria-label="Filter runs"></label>
<div class="project-picker"><span id="project-symbol"></span><select id="project-select" aria-label="Project"></select><button id="project-details" class="icon-button" aria-label="Project details"></button></div>
<nav aria-label="Workspace views"><button id="overview-tab" class="nav"><span id="overview-symbol" aria-hidden="true"></span><span>Overview</span></button></nav>
<div id="sidebar-list"></div><button id="new-suite" class="new-suite"><span id="add-symbol" aria-hidden="true"></span><span>New Suite</span></button></aside>
<div class="content-shell"><header class="toolbar"><button id="sidebar-toggle" class="icon-button" aria-label="Toggle sidebar" aria-expanded="true" aria-controls="workspace-sidebar"></button><div id="toolbar-context"></div><div id="toolbar-actions" class="actions"></div></header><nav id="view-tabs" class="document-tabs" aria-label="Current view"></nav>
<div id="notice" role="status" hidden></div><main id="main"></main></div>
<footer class="statusbar"><span id="workspace-status">Local workspace</span><span class="local-status"><span class="status-dot" aria-hidden="true"></span>Apple Foundation Models · On this Mac</span></footer></div>
<script type="module">/* SCRIPT */</script></body></html>
