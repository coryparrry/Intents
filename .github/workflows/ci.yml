name: CI

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Workflow and script checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate workflows
        # actionlint has not listed GitHub's hosted Xcode 27 preview label yet.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color -ignore 'label "xcode-27" is unknown'
      - name: Check shell scripts
        run: shellcheck script/*.sh
      - name: Check Python examples
        run: python3 -m compileall -q examples
      - name: Test release validation
        run: python3 -m unittest discover -s script/tests -v

  regression:
    name: Portable regression tests
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Execute production scoring and installer tests
        run: swift test --enable-code-coverage

  build:
    name: Compile app and tests
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers
      - name: Check scripts and examples
        run: |
          for script in script/*.sh; do bash -n "$script"; done
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('examples').rglob('*.py'):
              ast.parse(path.read_text(), filename=str(path))
          PY
      # The Xcode 27 hosted image runs macOS 26; this app needs macOS 27.
      # Compile both test targets here; execute tests on a macOS 27 machine.
      - name: Build app and test bundles
        run: |
          xcodebuild build-for-testing \
            -project FoundationEvals/FoundationEvals.xcodeproj \
            -scheme FoundationEvals \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO
