name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stability:
        description: Repeat the settings accessibility check ten times
        type: boolean
        default: false
  workflow_call:
    inputs:
      stability:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Workflow and script checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      native: ${{ steps.route.outputs.native }}
      ui: ${{ steps.route.outputs.ui }}
      input_conversion: ${{ steps.route.outputs.input_conversion }}
      sdk_consumer: ${{ steps.route.outputs.sdk_consumer }}
      native_tests: ${{ steps.route.outputs.native_tests }}
      regression: ${{ steps.route.outputs.regression }}
      swift_suites: ${{ steps.route.outputs.swift_suites }}
      python_tests: ${{ steps.route.outputs.python_tests }}
      macos_tests: ${{ steps.route.outputs.macos_tests }}
      ui_matrix: ${{ steps.route.outputs.ui_matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select coverage
        id: route
        run: python3 script/ci_routes.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ !cancelled() && steps.route.outcome == 'success' }}
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Tools/DocstringCoverage/package-lock.json
      - name: Install function documentation parsers
        if: ${{ !cancelled() && steps.route.outcome == 'success' }}
        run: npm ci --prefix Tools/DocstringCoverage --ignore-scripts --no-audit --no-fund
      - name: Validate release notes
        if: ${{ !cancelled() && steps.route.outcome == 'success' && github.event_name == 'pull_request' }}
        run: python3 script/release_notes.py validate-event
      - name: Validate workflows
        if: ${{ !cancelled() && steps.route.outcome == 'success' }}
        # actionlint has not listed GitHub's hosted Xcode 27 preview label yet.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color -ignore 'label "xcode-27" is unknown'
      - name: Check shell scripts
        if: ${{ !cancelled() && steps.route.outcome == 'success' }}
        run: shellcheck script/*.sh
      - name: Check Python examples
        if: ${{ !cancelled() && steps.route.outcome == 'success' }}
        run: python3 -m compileall -q examples
      - name: Check website
        if: ${{ !cancelled() && steps.route.outcome == 'success' && hashFiles('website/dist/app.js') != '' }}
        working-directory: website
        run: |
          node --check dist/app.js
          node --check dist/demo-data.mjs
          node --check dist/demo-interactions.mjs
          node scripts/inline-styles.mjs --check
          node --test tests/*.test.mjs
      - name: Run selected script unit tests
        if: ${{ !cancelled() && steps.route.outcome == 'success' }}
        env:
          CI_TEST_SELECTION: ${{ steps.route.outputs.python_tests }}
        run: python3 script/ci_run_tests.py python

  swift-tests:
    name: Portable regression tests
    needs: [changes, native-build]
    # Keep the required name green on Ubuntu when no Apple checks are selected.
    # A skipped native build must not suppress portable-only work.
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.native_tests == '[]' || needs.native-build.result == 'success') }}
    runs-on: ${{ needs.changes.outputs.regression == 'true' && 'xcode-27' || 'ubuntu-24.04' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        id: source
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.changes.outputs.native_tests != '[]'
        with:
          name: native-test-products
          path: ${{ runner.temp }}
      - name: Restore built test products
        if: needs.changes.outputs.native_tests != '[]'
        run: tar -xf "$RUNNER_TEMP/native-tests.tar" -C "$RUNNER_TEMP"
      - name: Run core tests without rebuilding
        if: needs.changes.outputs.native_tests != '[]'
        env:
          CI_TEST_SELECTION: ${{ needs.changes.outputs.native_tests }}
        run: |
          defaults write com.coryparry.FoundationEvals SUEnableAutomaticChecks -bool false
          defaults write com.coryparry.FoundationEvals SUAutomaticallyUpdate -bool false
          python3 script/ci_native_tests.py --products "$RUNNER_TEMP/Products" --result "$RUNNER_TEMP/core-tests.xcresult"
      - name: Upload core results
        if: ${{ !cancelled() && needs.changes.outputs.native_tests != '[]' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-core-results
          path: |
            ${{ runner.temp }}/core-tests.xcresult
            ${{ runner.temp }}/core-tests.log
      - name: Run selected macOS script tests
        if: ${{ !cancelled() && steps.source.outcome == 'success' && needs.changes.outputs.macos_tests != '[]' }}
        env:
          CI_TEST_SELECTION: ${{ needs.changes.outputs.macos_tests }}
        run: python3 script/ci_run_tests.py python
      - name: Identify Swift toolchain
        if: ${{ !cancelled() && steps.source.outcome == 'success' && needs.changes.outputs.swift_suites != '[]' }}
        id: toolchain
        run: echo "version=$(xcrun swift --version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore reusable Swift build
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.toolchain.outcome == 'success' && needs.changes.outputs.swift_suites != '[]' }}
        id: swift-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/portable-build
          key: ${{ runner.os }}-${{ runner.arch }}-swift-tests-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved', '**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-tests-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved', '**/Package.resolved') }}-
      - name: Run selected Swift suites
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.toolchain.outcome == 'success' && steps.swift-cache.outcome == 'success' && needs.changes.outputs.swift_suites != '[]' }}
        id: swift-regressions
        env:
          CI_TEST_SELECTION: ${{ needs.changes.outputs.swift_suites }}
        run: |
          python3 script/ci_native_cache.py restore --root "$GITHUB_WORKSPACE" --derived-data "$RUNNER_TEMP/portable-build"
          python3 script/ci_run_tests.py swift --scratch-path "$RUNNER_TEMP/portable-build"
          python3 script/ci_native_cache.py capture --root "$GITHUB_WORKSPACE" --derived-data "$RUNNER_TEMP/portable-build"

      - name: Report empty Apple selection
        if: ${{ needs.changes.outputs.regression == 'false' }}
        run: echo "No Apple regression checks selected; validation completed on Ubuntu."

  native-build:
    name: Build native test bundles
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Identify native toolchain
        id: toolchain
        run: echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore incremental native build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/DerivedData/Build
            ${{ runner.temp }}/DerivedData/ModuleCache.noindex
            ${{ runner.temp }}/DerivedData/SDKStatCaches.noindex
            ${{ runner.temp }}/DerivedData/CompilationCache.noindex
            ${{ runner.temp }}/DerivedData/SourcePackages
            ${{ runner.temp }}/DerivedData/ci-source-metadata.json
          key: ${{ runner.os }}-${{ runner.arch }}-native-v2-${{ steps.toolchain.outputs.version }}-${{ needs.changes.outputs.ui }}-${{ hashFiles('**/project.pbxproj', '**/*.xcscheme', 'Package.swift', '**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-native-v2-${{ steps.toolchain.outputs.version }}-${{ needs.changes.outputs.ui }}-${{ hashFiles('**/project.pbxproj', '**/*.xcscheme', 'Package.swift', '**/Package.resolved') }}-
            ${{ runner.os }}-${{ runner.arch }}-native-v2-${{ steps.toolchain.outputs.version }}-${{ needs.changes.outputs.ui != 'true' }}-${{ hashFiles('**/project.pbxproj', '**/*.xcscheme', 'Package.swift', '**/Package.resolved') }}-
      - name: Build app and selected test bundles once
        env:
          INCLUDE_UI: ${{ needs.changes.outputs.ui }}
        run: |
          xcodebuild -version
          python3 script/ci_native_cache.py restore --root "$GITHUB_WORKSPACE" --derived-data "$RUNNER_TEMP/DerivedData"
          python3 script/ci_core_scheme.py
          scheme=FoundationEvalsCoreCI
          if [[ "$INCLUDE_UI" == true ]]; then scheme=FoundationEvals; fi
          # Share compiled products across full/core builds, but regenerate their scheme descriptors.
          rm -f "$RUNNER_TEMP/DerivedData/Build/Products"/FoundationEvals*_macosx*.xctestrun
          xcodebuild build-for-testing \
            -project FoundationEvals/FoundationEvals.xcodeproj \
            -scheme "$scheme" -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual
          descriptors=("$RUNNER_TEMP/DerivedData/Build/Products"/FoundationEvals*_macosx*.xctestrun)
          [[ ${#descriptors[@]} == 1 && -f ${descriptors[0]} && ${descriptors[0]##*/} == "${scheme}_macosx"*.xctestrun ]]
          python3 script/ci_native_cache.py capture --root "$GITHUB_WORKSPACE" --derived-data "$RUNNER_TEMP/DerivedData"
      - name: Archive test products with executable modes and symlinks
        run: tar -cf "$RUNNER_TEMP/native-tests.tar" -C "$RUNNER_TEMP/DerivedData/Build" Products
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-test-products
          path: ${{ runner.temp }}/native-tests.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  ui-tests:
    name: UI tests (${{ matrix.name }})
    needs: [changes, native-build]
    if: ${{ needs.changes.outputs.ui == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.ui_matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-test-products
          path: ${{ runner.temp }}
      - name: Restore built test products
        run: tar -xf "$RUNNER_TEMP/native-tests.tar" -C "$RUNNER_TEMP"
      - name: Prepare measured UI desktop
        timeout-minutes: 3
        run: |
          defaults write com.apple.dock autohide -bool true
          killall Dock || true
          defaults write com.coryparry.FoundationEvals SUEnableAutomaticChecks -bool false
          defaults write com.coryparry.FoundationEvals SUAutomaticallyUpdate -bool false
          python3 script/ci_ui_display.py
      - name: Run affected UI tests once
        # Leave time to export/upload evidence when this step times out.
        timeout-minutes: 16
        env:
          CI_TEST_SELECTION: ${{ toJSON(matrix.tests) }}
        run: python3 script/ci_native_tests.py --products "$RUNNER_TEMP/Products" --result "$RUNNER_TEMP/ui-tests.xcresult"
      - name: Export UI test attachments
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/ui-snapshots"
          if [[ -d /private/tmp/foundation-evals-ui-tests/Screenshots ]]; then
            cp -R /private/tmp/foundation-evals-ui-tests/Screenshots "$RUNNER_TEMP/ui-snapshots/screenshots"
          fi
          if [[ -d "$RUNNER_TEMP/ui-tests.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui-tests.xcresult" --output-path "$RUNNER_TEMP/ui-snapshots"
          fi
      - name: Upload UI results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-results-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/ui-tests.xcresult
            ${{ runner.temp }}/ui-tests.log
            ${{ runner.temp }}/ui-snapshots

  picker-stability:
    name: Picker stability (10 repetitions)
    needs: [changes, native-build]
    if: ${{ inputs.stability == true && needs.changes.outputs.ui == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-test-products
          path: ${{ runner.temp }}
      - name: Restore and prepare desktop
        run: |
          tar -xf "$RUNNER_TEMP/native-tests.tar" -C "$RUNNER_TEMP"
          defaults write com.apple.dock autohide -bool true
          killall Dock || true
          defaults write com.coryparry.FoundationEvals SUEnableAutomaticChecks -bool false
          defaults write com.coryparry.FoundationEvals SUAutomaticallyUpdate -bool false
          python3 script/ci_ui_display.py
      - name: Repeat preparation picker ten times
        env:
          CI_TEST_SELECTION: '["FoundationEvalsUITests/WorkspacePolishUITests/testSettingsTabsKeepTheirPrimaryControlsAccessible"]'
        run: python3 script/ci_native_tests.py --products "$RUNNER_TEMP/Products" --result "$RUNNER_TEMP/picker-tests.xcresult" --iterations 10
      - name: Upload stability results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: picker-stability-results
          path: |
            ${{ runner.temp }}/picker-tests.xcresult
            ${{ runner.temp }}/picker-tests.log

  build:
    # Preserve the required name while checking the actual workers once.
    name: Compile app and tests
    needs: [changes, swift-tests, native-build, ui-tests, picker-stability]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        id: source
        with:
          persist-credentials: false
      - name: Require every selected CI check
        id: gate
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_SELECTION_JSON: ${{ toJSON(needs.changes.outputs) }}
          CI_STABILITY_REQUESTED: ${{ inputs.stability == true }}
        run: python3 script/ci_gate.py
      - name: Explain failed checks and link their evidence
        if: ${{ always() && steps.source.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_GATE_RESULT: ${{ steps.gate.outcome }}
        run: python3 script/ci_failure_summary.py
