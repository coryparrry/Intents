name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stability:
        description: Repeat the picker stability check ten times
        type: boolean
        default: false
  workflow_call:
    inputs:
      stability:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Route changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.route.outputs.native }}
      ui: ${{ steps.route.outputs.ui }}
      automation_e2e: ${{ steps.route.outputs.automation_e2e }}
      input_conversion: ${{ steps.route.outputs.input_conversion }}
      sdk_consumer: ${{ steps.route.outputs.sdk_consumer }}
      native_tests: ${{ steps.route.outputs.native_tests }}
      regression: ${{ steps.route.outputs.regression }}
      swift_suites: ${{ steps.route.outputs.swift_suites }}
      python_tests: ${{ steps.route.outputs.python_tests }}
      macos_tests: ${{ steps.route.outputs.macos_tests }}
      ui_matrix: ${{ steps.route.outputs.ui_matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select coverage
        id: route
        run: python3 script/ci_routes.py

  lint:
    name: Workflow lint and static checks
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require successful routing
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
        run: test "$ROUTING_RESULT" = success
      - name: Validate release notes
        if: github.event_name == 'pull_request'
        run: python3 script/release_notes.py validate-event
      - name: Validate workflows
        # actionlint has not listed GitHub's hosted Xcode 27 preview label yet.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color -ignore 'label "xcode-27" is unknown'
      - name: Check shell scripts
        run: shellcheck script/*.sh
      - name: Check Python examples
        run: python3 -m compileall -q examples
      - name: Check website
        if: hashFiles('website/dist/app.js') != ''
        working-directory: website
        run: |
          node --check dist/app.js
          node --check dist/demo-data.mjs
          node --check dist/demo-interactions.mjs
          node scripts/inline-styles.mjs --check
          node --test tests/*.test.mjs

  script-tests:
    name: Script tests
    needs: changes
    # Finish an empty selection successfully: a skipped ancestor can also skip
    # Mac workers downstream of the always-running quality aggregate.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run selected script unit tests
        env:
          CI_TEST_SELECTION: ${{ needs.changes.outputs.python_tests }}
        run: python3 script/ci_run_tests.py python

  quality:
    name: Workflow and script checks
    needs: [changes, lint, script-tests]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all selected checks
        env:
          ROUTING: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.script-tests.result }}
        run: |
          test "$ROUTING" = success
          test "$LINT" = success
          test "$TESTS" = success

  swift-tests:
    name: Portable Swift and macOS script tests
    needs: [changes, quality]
    if: ${{ needs.changes.outputs.swift_suites != '[]' || needs.changes.outputs.macos_tests != '[]' }}
    runs-on: xcode-27
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run selected macOS script tests
        if: needs.changes.outputs.macos_tests != '[]'
        env:
          CI_TEST_SELECTION: ${{ needs.changes.outputs.macos_tests }}
        run: python3 script/ci_run_tests.py python
      - name: Identify Swift toolchain
        if: needs.changes.outputs.swift_suites != '[]'
        id: toolchain
        run: echo "version=$(xcrun swift --version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore reusable Swift build
        if: needs.changes.outputs.swift_suites != '[]'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/portable-build
          key: ${{ runner.os }}-${{ runner.arch }}-swift-tests-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved', '**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-tests-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved', '**/Package.resolved') }}-
      - name: Run selected portable Swift suites
        if: needs.changes.outputs.swift_suites != '[]'
        env:
          CI_TEST_SELECTION: ${{ needs.changes.outputs.swift_suites }}
        run: |
          python3 script/ci_native_cache.py restore --root "$GITHUB_WORKSPACE" --derived-data "$RUNNER_TEMP/portable-build"
          python3 script/ci_run_tests.py swift --scratch-path "$RUNNER_TEMP/portable-build"
          python3 script/ci_native_cache.py capture --root "$GITHUB_WORKSPACE" --derived-data "$RUNNER_TEMP/portable-build"

  sdk-consumer:
    name: Clean Intent Lab SDK consumer
    needs: [changes, quality]
    if: ${{ needs.changes.outputs.sdk_consumer == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      CI_TEST_SELECTION: '["IntentLabProjectInstallerTests"]'
      INTENT_LAB_RUN_MAC_INSTALLER_BUILD_TEST: '1'
      INTENT_LAB_CONSUMER_PACKAGE_URL: https://github.com/coryparrry/Intents.git
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install consumer project generator
        run: command -v xcodegen || brew install xcodegen
      - name: Read immutable installer package revision
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          source = Path("FoundationEvals/FoundationEvals/Services/IntentLabProjectInstaller.swift").read_text()
          revisions = re.findall(r'static let verifiedRevision: String\? = "([0-9a-f]{40})"', source)
          if len(revisions) != 1:
              raise SystemExit("Installer must pin exactly one immutable package revision")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"INTENT_LAB_CONSUMER_REVISION={revisions[0]}\n")
              output.write(f"INTENT_LAB_CONSUMER_BUILD_RECEIPT={os.environ['RUNNER_TEMP']}/intentlab-consumer/receipt.json\n")
          PY
      - name: Build fresh external consumers of the pinned SDK
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/intentlab-consumer"
          python3 script/ci_run_tests.py swift --scratch-path "$RUNNER_TEMP/intentlab-consumer-build" 2>&1 | tee "$RUNNER_TEMP/intentlab-consumer/build.log"
      - name: Verify external consumer build receipt
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads(Path(os.environ["INTENT_LAB_CONSUMER_BUILD_RECEIPT"]).read_text())
          expected = {
              "schemaVersion": 1,
              "packageURL": os.environ["INTENT_LAB_CONSUMER_PACKAGE_URL"],
              "revision": os.environ["INTENT_LAB_CONSUMER_REVISION"],
              "check": "generatedMacUITestTargetBuildsWithXcode",
              "signing": "disabled",
              "runtime": "not-executed",
          }
          if any(receipt.get(key) != value for key, value in expected.items()):
              raise SystemExit("External consumer receipt does not match the required SDK build")
          if sorted(receipt.get("products", [])) != ["FoundationEvalsDeveloper", "IntentLabTesting"]:
              raise SystemExit("Both public SDK products must compile from the pinned remote revision")
          print(f"Verified fresh external consumers of {expected['revision']}")
          PY
      - name: Upload external consumer build evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: intentlab-external-consumer
          path: ${{ runner.temp }}/intentlab-consumer
          if-no-files-found: error

  regression:
    name: Portable regression tests
    needs: [changes, quality, swift-tests, sdk-consumer]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all selected regressions
        env:
          ROUTING: ${{ needs.changes.result }}
          QUALITY: ${{ needs.quality.result }}
          SWIFT: ${{ needs.swift-tests.result }}
          SDK: ${{ needs.sdk-consumer.result }}
          SDK_SELECTED: ${{ needs.changes.outputs.sdk_consumer }}
          SWIFT_SELECTION: ${{ needs.changes.outputs.swift_suites }}
          MACOS_SELECTION: ${{ needs.changes.outputs.macos_tests }}
        run: |
          test "$ROUTING" = success
          test "$QUALITY" = success
          if [[ "$SWIFT_SELECTION" == '[]' && "$MACOS_SELECTION" == '[]' ]]; then
            test "$SWIFT" = skipped
          else
            test "$SWIFT" = success
          fi
          case "$SDK_SELECTED" in
            true) test "$SDK" = success ;;
            false) test "$SDK" = skipped ;;
            *) exit 1 ;;
          esac

  native-build:
    name: Build native test bundles
    needs: [changes, quality]
    if: ${{ needs.changes.outputs.native == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Identify native toolchain
        id: toolchain
        run: echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore incremental native build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/DerivedData/Build
            ${{ runner.temp }}/DerivedData/ModuleCache.noindex
            ${{ runner.temp }}/DerivedData/SDKStatCaches.noindex
            ${{ runner.temp }}/DerivedData/CompilationCache.noindex
            ${{ runner.temp }}/DerivedData/SourcePackages
            ${{ runner.temp }}/DerivedData/ci-source-metadata.json
          key: ${{ runner.os }}-${{ runner.arch }}-native-v1-${{ steps.toolchain.outputs.version }}-${{ needs.changes.outputs.ui }}-${{ hashFiles('**/project.pbxproj', '**/*.xcscheme', 'Package.swift', '**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-native-v1-${{ steps.toolchain.outputs.version }}-${{ needs.changes.outputs.ui }}-${{ hashFiles('**/project.pbxproj', '**/*.xcscheme', 'Package.swift', '**/Package.resolved') }}-
            ${{ runner.os }}-${{ runner.arch }}-native-v1-${{ steps.toolchain.outputs.version }}-${{ needs.changes.outputs.ui != 'true' }}-${{ hashFiles('**/project.pbxproj', '**/*.xcscheme', 'Package.swift', '**/Package.resolved') }}-
      - name: Build app and selected test bundles once
        env:
          INCLUDE_UI: ${{ needs.changes.outputs.ui }}
        run: |
          xcodebuild -version
          python3 script/ci_native_cache.py restore --root "$GITHUB_WORKSPACE" --derived-data "$RUNNER_TEMP/DerivedData"
          python3 script/ci_core_scheme.py
          scheme=FoundationEvalsCoreCI
          if [[ "$INCLUDE_UI" == true ]]; then scheme=FoundationEvals; fi
          # Share compiled products across full/core builds, but regenerate their scheme descriptors.
          rm -f "$RUNNER_TEMP/DerivedData/Build/Products"/FoundationEvals*_macosx*.xctestrun
          xcodebuild build-for-testing \
            -project FoundationEvals/FoundationEvals.xcodeproj \
            -scheme "$scheme" -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO
          descriptors=("$RUNNER_TEMP/DerivedData/Build/Products"/FoundationEvals*_macosx*.xctestrun)
          [[ ${#descriptors[@]} == 1 && -f ${descriptors[0]} && ${descriptors[0]##*/} == "${scheme}_macosx"*.xctestrun ]]
          python3 script/ci_native_cache.py capture --root "$GITHUB_WORKSPACE" --derived-data "$RUNNER_TEMP/DerivedData"
      - name: Archive test products with executable modes and symlinks
        run: tar -cf "$RUNNER_TEMP/native-tests.tar" -C "$RUNNER_TEMP/DerivedData/Build" Products
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-test-products
          path: ${{ runner.temp }}/native-tests.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  native-tests:
    name: Native core tests
    needs: [changes, native-build]
    if: ${{ needs.changes.outputs.native_tests != '[]' }}
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-test-products
          path: ${{ runner.temp }}
      - name: Restore built test products
        run: tar -xf "$RUNNER_TEMP/native-tests.tar" -C "$RUNNER_TEMP"
      - name: Run core tests without rebuilding
        env:
          CI_TEST_SELECTION: ${{ needs.changes.outputs.native_tests }}
        run: |
          defaults write com.coryparry.FoundationEvals SUEnableAutomaticChecks -bool false
          defaults write com.coryparry.FoundationEvals SUAutomaticallyUpdate -bool false
          python3 script/ci_native_tests.py --products "$RUNNER_TEMP/Products" --result "$RUNNER_TEMP/core-tests.xcresult"
      - name: Upload core results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-core-results
          path: |
            ${{ runner.temp }}/core-tests.xcresult
            ${{ runner.temp }}/core-tests.log

  ui-tests:
    name: UI tests (${{ matrix.name }})
    needs: [changes, native-build]
    if: ${{ needs.changes.outputs.ui == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.ui_matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-test-products
          path: ${{ runner.temp }}
      - name: Restore built test products
        run: tar -xf "$RUNNER_TEMP/native-tests.tar" -C "$RUNNER_TEMP"
      - name: Prepare measured UI desktop
        timeout-minutes: 3
        run: |
          defaults write com.apple.dock autohide -bool true
          killall Dock || true
          defaults write com.coryparry.FoundationEvals SUEnableAutomaticChecks -bool false
          defaults write com.coryparry.FoundationEvals SUAutomaticallyUpdate -bool false
          python3 script/ci_ui_display.py
      - name: Run affected UI tests once
        env:
          CI_TEST_SELECTION: ${{ toJSON(matrix.tests) }}
        run: python3 script/ci_native_tests.py --products "$RUNNER_TEMP/Products" --result "$RUNNER_TEMP/ui-tests.xcresult"
      - name: Export UI test attachments
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/ui-snapshots"
          if [[ -d /private/tmp/foundation-evals-ui-tests/Screenshots ]]; then
            cp -R /private/tmp/foundation-evals-ui-tests/Screenshots "$RUNNER_TEMP/ui-snapshots/screenshots"
          fi
          if [[ -d "$RUNNER_TEMP/ui-tests.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui-tests.xcresult" --output-path "$RUNNER_TEMP/ui-snapshots"
          fi
      - name: Upload UI results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-results-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/ui-tests.xcresult
            ${{ runner.temp }}/ui-tests.log
            ${{ runner.temp }}/ui-snapshots

  picker-stability:
    name: Picker stability (10 repetitions)
    needs: [changes, native-build]
    if: ${{ inputs.stability && needs.changes.outputs.ui == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-test-products
          path: ${{ runner.temp }}
      - name: Restore and prepare desktop
        run: |
          tar -xf "$RUNNER_TEMP/native-tests.tar" -C "$RUNNER_TEMP"
          defaults write com.apple.dock autohide -bool true
          killall Dock || true
          defaults write com.coryparry.FoundationEvals SUEnableAutomaticChecks -bool false
          defaults write com.coryparry.FoundationEvals SUAutomaticallyUpdate -bool false
          python3 script/ci_ui_display.py
      - name: Repeat preparation picker ten times
        env:
          CI_TEST_SELECTION: '["FoundationEvalsUITests/AppAutomationUITests/testPreparationPickersUseStableIdentifiers"]'
        run: python3 script/ci_native_tests.py --products "$RUNNER_TEMP/Products" --result "$RUNNER_TEMP/picker-tests.xcresult" --iterations 10
      - name: Upload stability results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: picker-stability-results
          path: |
            ${{ runner.temp }}/picker-tests.xcresult
            ${{ runner.temp }}/picker-tests.log

  build:
    # Retain the existing required-check name while covering every selected lane.
    name: Compile app and tests
    needs: [changes, quality, regression, native-build, sdk-consumer, native-tests, ui-tests, picker-stability, automation-e2e, input-conversion]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every selected CI check
        env:
          ROUTING: ${{ needs.changes.result }}
          QUALITY: ${{ needs.quality.result }}
          REGRESSION: ${{ needs.regression.result }}
          BUILD: ${{ needs.native-build.result }}
          BUILD_SELECTED: ${{ needs.changes.outputs.native }}
          SDK: ${{ needs.sdk-consumer.result }}
          SDK_SELECTED: ${{ needs.changes.outputs.sdk_consumer }}
          CORE: ${{ needs.native-tests.result }}
          CORE_SELECTION: ${{ needs.changes.outputs.native_tests }}
          UI: ${{ needs.ui-tests.result }}
          UI_SELECTED: ${{ needs.changes.outputs.ui }}
          STABILITY: ${{ needs.picker-stability.result }}
          STABILITY_SELECTED: ${{ inputs.stability && needs.changes.outputs.ui == 'true' }}
          AUTOMATION: ${{ needs.automation-e2e.result }}
          INPUT_CONVERSION: ${{ needs.input-conversion.result }}
          INPUT_CONVERSION_SELECTED: ${{ needs.changes.outputs.input_conversion }}
        run: |
          require_selected() {
            case "$1" in
              true) test "$2" = success ;;
              false) test "$2" = skipped ;;
              *) return 1 ;;
            esac
          }
          test "$ROUTING" = success
          test "$QUALITY" = success
          test "$REGRESSION" = success
          test "$AUTOMATION" = success
          require_selected "$BUILD_SELECTED" "$BUILD"
          require_selected "$SDK_SELECTED" "$SDK"
          if [[ "$CORE_SELECTION" == '[]' ]]; then test "$CORE" = skipped; else test "$CORE" = success; fi
          require_selected "$UI_SELECTED" "$UI"
          require_selected "$STABILITY_SELECTED" "$STABILITY"
          require_selected "$INPUT_CONVERSION_SELECTED" "$INPUT_CONVERSION"

  automation-e2e-scenarios:
    name: Simulator acceptance tests
    needs: [changes, quality]
    if: ${{ needs.changes.outputs.automation_e2e == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      # Exercise the cross-build acceptance from Phase 1, beyond local Xcode 27.0.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Identify Swift toolchain
        id: toolchain
        run: echo "version=$(xcrun swift --version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore reusable Swift build
        id: cli-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/automation-e2e-build
          key: ${{ runner.os }}-${{ runner.arch }}-automation-e2e-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved', '**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-automation-e2e-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved', '**/Package.resolved') }}-
      - name: Install fixture project generator
        run: command -v xcodegen || brew install xcodegen
      - name: Install matching simulator runtime
        timeout-minutes: 15
        run: |
          xcodebuild -version
          if ! xcrun simctl list runtimes -j | python3 -c 'import json, sys; sys.exit(not any(r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-") and r["version"] == "27.1" and r.get("isAvailable") for r in json.load(sys.stdin)["runtimes"]))'; then
            # Apple's catalog identifies the iOS 27.1 release candidate as 27.1.0.0.
            xcodebuild -downloadPlatform iOS -buildVersion 27.1.0.0 -architectureVariant arm64
          fi
      - name: Reproduce prepared-app automation
        id: contract
        run: |
          python3 script/ci_native_cache.py restore --root "$GITHUB_WORKSPACE" --derived-data "$RUNNER_TEMP/automation-e2e-build"
          python3 script/automation_e2e.py --output-root "$RUNNER_TEMP/automation-e2e" --build-root "$RUNNER_TEMP/automation-e2e-build" --record-build-cache --scenario-group all
      - name: Save successfully compiled automation CLI
        if: ${{ !cancelled() && steps.contract.outputs.cli_built == 'true' && steps.cli-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/automation-e2e-build
          key: ${{ steps.cli-cache.outputs.cache-primary-key }}
      - name: Upload automation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: automation-e2e
          path: ${{ runner.temp }}/automation-e2e
          if-no-files-found: error


  automation-e2e:
    name: Automation e2e (simulator)
    needs: [changes, automation-e2e-scenarios]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected simulator scenario group
        env:
          ROUTING: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.automation_e2e }}
          SCENARIOS: ${{ needs.automation-e2e-scenarios.result }}
        run: |
          test "$ROUTING" = success
          case "$SELECTED" in
            true) test "$SCENARIOS" = success ;;
            false) test "$SCENARIOS" = skipped ;;
            *) exit 1 ;;
          esac

  input-conversion:
    name: Input conversion diagnostic (Mac)
    needs: [changes, quality]
    if: ${{ needs.changes.outputs.input_conversion == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Identify Swift toolchain
        id: toolchain
        run: echo "version=$(xcrun swift --version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore reusable Swift build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/input-conversion-build
          key: ${{ runner.os }}-${{ runner.arch }}-input-conversion-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved', '**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-input-conversion-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved', '**/Package.resolved') }}-
      # This canary checks a String setter/readback in its authored Mac fixture.
      # It neither executes a business subject nor grants codec execution authority.
      - name: Run live input setter/readback canary
        env:
          INTENTS_MAC_INPUT_PROBE_FIXTURE_LIVE: '1'
          INTENTS_MAC_INPUT_PROBE_FIXTURE_ROOT: ${{ runner.temp }}/input-conversion
        run: |
          mkdir -p "$INTENTS_MAC_INPUT_PROBE_FIXTURE_ROOT"
          DEVELOPER_DIR="$(xcode-select -p)"
          export DEVELOPER_DIR
          python3 script/ci_native_cache.py restore --root "$GITHUB_WORKSPACE" --derived-data "$RUNNER_TEMP/input-conversion-build"
          set -o pipefail
          swift test --jobs "$(sysctl -n hw.logicalcpu)" \
            --scratch-path "$RUNNER_TEMP/input-conversion-build" \
            --filter 'AutomationMacInputProbeFixtureTests/testAuthoredInputProbeFixtureWhenRequested' \
            2>&1 | tee "$INTENTS_MAC_INPUT_PROBE_FIXTURE_ROOT/test.log"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          log = (Path(os.environ['INTENTS_MAC_INPUT_PROBE_FIXTURE_ROOT']) / 'test.log').read_text()
          test = 'testAuthoredInputProbeFixtureWhenRequested'
          assert re.search(r"Test Case .*" + test + r".* passed", log), 'Live input canary did not pass'
          assert 'Authored String setter/readback calibration only;' in log, 'Live calibration did not execute'
          PY
          python3 script/ci_native_cache.py capture --root "$GITHUB_WORKSPACE" --derived-data "$RUNNER_TEMP/input-conversion-build"
      - name: Upload input conversion diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: input-conversion-mac
          path: ${{ runner.temp }}/input-conversion
          if-no-files-found: error
