name: Production eval fixtures
on:
  pull_request:
    paths:
      - 'Packages/ProductionEvals/**'
      - 'Sources/ProductionEvalsCLI/**'
      - 'Sources/FoundationEvalsDeveloper/DeveloperProductionCapture.swift'
      - 'script/ci_production_evals.sh'
      - 'script/test_production_evals.py'
      - 'Package.swift'
      - '.github/workflows/production-evals.yml'
  push:
    branches: [main]
    paths:
      - 'Packages/ProductionEvals/**'
      - 'Sources/ProductionEvalsCLI/**'
      - 'Sources/FoundationEvalsDeveloper/DeveloperProductionCapture.swift'
      - 'script/ci_production_evals.sh'
      - 'script/test_production_evals.py'
      - 'Package.swift'
      - '.github/workflows/production-evals.yml'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: production-evals-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fixtures:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Qualify production recovery and worker protocol
        run: bash script/ci_production_evals.sh
