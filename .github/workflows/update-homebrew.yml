name: Update Homebrew

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

jobs:
  update:
    name: Verify release and update cask
    if: github.event_name == 'release' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: homebrew-intents
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check tap credentials
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
        run: |
          if [[ -z "$TAP_KEY" ]]; then
            echo '::error::Configure HOMEBREW_TAP_SSH_KEY (see docs/releasing.md).'
            exit 1
          fi
      - name: Check out protected updater
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false
      - name: Check out Homebrew tap
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: coryparrry/homebrew-tap
          ref: main
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
      - name: Download and verify the published installer
        run: python3 control/script/update_homebrew.py "$RELEASE_TAG" --tap-dir tap
      - name: Check cask syntax
        run: ruby -c tap/Casks/intents.rb
      - name: Commit and push the cask update
        working-directory: tap
        run: |
          git add -- Casks/intents.rb
          if git diff --cached --quiet; then
            echo 'Homebrew cask is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(cask): update intents to $RELEASE_TAG"
          git push origin HEAD:main
