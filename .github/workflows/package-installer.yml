name: Build DMG and publish release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Pending draft release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-installer-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize, verify, and publish
    runs-on: xcode-27
    environment: release
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_DIR: ${{ github.workspace }}/source
      RELEASE_TAG: ${{ inputs.tag }}
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
      APPLE_TEAM_ID: 3Z3955EFRE
      EXPECTED_TEAM_ID: 3Z3955EFRE
    steps:
      - name: Require the default branch
        env:
          EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "$EXPECTED_REF" ]]; then
            echo 'Run release packaging from the default branch.' >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Select a vMAJOR.MINOR.PATCH release tag.' >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Resolve the draft's immutable source
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_sha="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json targetCommitish,isDraft --jq 'if .isDraft then .targetCommitish else error("Release is already published") end')"
          if [[ ! "$source_sha" =~ ^[a-f0-9]{40}$ || ( -n "$EXPECTED_SOURCE_SHA" && "$source_sha" != "$EXPECTED_SOURCE_SHA" ) ]]; then
            echo 'Draft release source must match the immutable release candidate SHA.' >&2
            exit 1
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.candidate.outputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Set the installer build number
        run: |
          echo "BUILD_NUMBER=$(git -C "$SOURCE_DIR" rev-list --count HEAD)" >> "$GITHUB_ENV"
      - name: Check signing configuration
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          missing=0
          for name in CERTIFICATE_P12_BASE64 CERTIFICATE_PASSWORD SPARKLE_PRIVATE_KEY NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure $name in the release environment (see docs/releasing.md)."
              missing=1
            fi
          done
          exit "$missing"
      - name: Wait for the release commit's CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
        run: bash control/script/wait_release_ci.sh
      - name: Validate candidate and exact source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash control/script/release_dispatch.sh prepare
      - name: Build, sign, notarize, and verify installer
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: bash control/script/release.sh
      - name: Upload, verify downloads, and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash control/script/release_dispatch.sh publish

  homebrew:
    name: Update Homebrew after publication
    needs: release
    # Releases published with GITHUB_TOKEN do not trigger release workflows.
    uses: ./.github/workflows/update-homebrew.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
