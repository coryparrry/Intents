name: AutomationFixture
options:
  bundleIdPrefix: com.coryparry.IntentsAutomation
  deploymentTarget:
    iOS: '26.0'
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) INTENTS_AUTOMATION_CI_FIXTURE'
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '1.0'
    CODE_SIGNING_ALLOWED: NO
    INFOPLIST_KEY_CFBundleDisplayName: Automation Fixture
    INFOPLIST_KEY_CFBundleName: Automation Fixture
targets:
  AutomationFixture:
    type: application
    platform: iOS
    sources: [App, Models]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coryparry.IntentsAutomation.AutomationFixture
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  AutomationFixtureMac:
    type: application
    platform: macOS
    sources: [App, Models]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coryparry.IntentsAutomation.AutomationFixtureMac
schemes:
  AutomationFixture:
    build:
      targets:
        AutomationFixture: all
  AutomationFixtureMac:
    build:
      targets:
        AutomationFixtureMac: all
