name: IntentLabTasks
options:
  bundleIdPrefix: com.example
configs:
  Debug: debug
  Release: release
  IntentLabTesting: debug
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    SWIFT_VERSION: "6.0"
packages:
  FoundationEvals:
    path: ../..
targets:
  IntentLabTasks:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: FoundationEvals
        product: IntentLabContracts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.IntentLabTasks
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Intent Lab Tasks
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) INTENT_LAB_TEST_SUPPORT"
        IntentLabTesting:
          PRODUCT_BUNDLE_IDENTIFIER: com.example.IntentLabTasks.integration-tests
          INFOPLIST_KEY_CFBundleDisplayName: Intent Lab Tasks Test
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) INTENT_LAB_TESTING INTENT_LAB_TEST_SUPPORT"
  IntentLabTasksUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
      - path: IntentLabIntegration.json
        buildPhase: resources
    dependencies:
      - target: IntentLabTasks
      - package: FoundationEvals
        product: IntentLabTesting
      - package: FoundationEvals
        product: IntentLabContracts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.IntentLabTasksUITests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TEST_TARGET_NAME: IntentLabTasks
schemes:
  IntentLabTasks:
    build:
      targets:
        IntentLabTasks: all
        IntentLabTasksUITests: [test]
    run:
      config: Debug
    test:
      config: IntentLabTesting
      targets:
        - IntentLabTasksUITests
