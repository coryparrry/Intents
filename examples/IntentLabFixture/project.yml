name: IntentLabFixture
options:
  bundleIdPrefix: com.example
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    SWIFT_VERSION: "6.0"
packages:
  FoundationEvalsDeveloper:
    path: ../..
targets:
  IntentLabFixture:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: FoundationEvalsDeveloper
        product: FoundationEvalsDeveloper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coryparry.IntentLabFixture
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Intent Lab Fixture
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) INTENT_LAB_TEST_SUPPORT"
  IntentLabFixtureV2UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes:
          - IntentLabSiriScenarioTests.swift
          - Siri
    resources:
      - UITests/Generated
    dependencies:
      - target: IntentLabFixture
      - package: FoundationEvalsDeveloper
        product: IntentLabTesting
      - package: FoundationEvalsDeveloper
        product: IntentLabContracts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coryparry.IntentLabFixtureV2UITests
        INTENT_LAB_HARNESS_VERSION: intent-lab-v2
        INTENT_LAB_HARNESS_CAPABILITIES: environment-payload direct-intent-execution direct-intent-output preparation accessible-result siri siri-completion invocation-correlation
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  IntentLabFixtureSiriUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/NotesIntentLabIntegration.swift
      - path: UITests/IntentLabSiriScenarioTests.swift
      - path: UITests/Siri/IntentLabIntegration.json
        buildPhase: resources
    dependencies:
      - target: IntentLabFixture
      - package: FoundationEvalsDeveloper
        product: IntentLabCoreTesting
      - package: FoundationEvalsDeveloper
        product: IntentLabContracts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coryparry.IntentLabFixtureSiriUITests
        INTENT_LAB_HARNESS_VERSION: intent-lab-v2
        INTENT_LAB_HARNESS_CAPABILITIES: environment-payload preparation accessible-result siri siri-completion invocation-correlation
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) INTENT_LAB_SIRI_ONLY"
  IntentLabFixtureUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../../Integration/AppIntentsTesting
        excludes:
          - README.md
    resources:
      - UITests/Generated
    dependencies:
      - target: IntentLabFixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coryparry.IntentLabFixtureUITests
        SWIFT_OBJC_BRIDGING_HEADER: ../../Integration/AppIntentsTesting/SiriActivationBridge.h
        INTENT_LAB_HARNESS_VERSION: intent-lab-v1
        INTENT_LAB_HARNESS_CAPABILITIES: environment-payload fixture-reset invocation-correlation accessible-result direct-intent-output
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
schemes:
  IntentLabFixture:
    build:
      targets:
        IntentLabFixture: all
        IntentLabFixtureUITests: [test]
    test:
      targets:
        - IntentLabFixtureUITests
  IntentLabFixtureV2:
    build:
      targets:
        IntentLabFixture: all
        IntentLabFixtureV2UITests: [test]
    test:
      targets:
        - IntentLabFixtureV2UITests
  IntentLabFixtureSiri:
    build:
      targets:
        IntentLabFixture: all
        IntentLabFixtureSiriUITests: [test]
    test:
      targets:
        - IntentLabFixtureSiriUITests
